<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="/src/app.js"></script>
    <link rel="shortcut icon" href="./assets/icon/icon.jpg" type="image/x-icon">
    <link rel="manifest" href="manifest.json">
    <title>Web Radio Streaming</title>
</head>

<body>
    <div class="glow"></div>

    <div id="github"></div>

    <main class="player" id="player">
        <div class="c_copertina">
            <div class="copertina" role="img" aria-label="Copertina del brano in onda">
                <img src="https://media.australian.museum/media/dd/images/mallard.ef584b7.width-800.8b55bd7.jpg"
                    id="immagine_copertina">
            </div>
        </div>

        <div class="player_info_controlli">
            <div class="metadata">
                <h1 id="titolo">Caricamento...</h1>
                <p id="artista">Radio Vocaloid</p>
            </div>

            <div class="player_controlli">
                <div class="c_play_pausa">
                    <button class="play" id="play" aria-label="Riproduci"></button>
                </div>

                <div class="c_vol">
                    <button id="mute" aria-label="Disattiva audio"></button>
                    <input type="range" id="volume" min="0" max="100" value="70" aria-label="Volume">
                    <div class="eq" aria-hidden="true"><b></b><b></b><b></b><b></b><b></b></div>
                    <span class="pct" id="pct">70</span>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
